<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>线路优选</title>
  <style>
    :root {
      --bg0: #0f1419;
      --bg1: #1a2332;
      --fg: #e8eef7;
      --muted: #8b9bb4;
      --accent: #3d9cf0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--fg);
      background:
        radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #243b55 0%, transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      display: grid;
      place-items: center;
      min-height: 100%;
    }
    .panel {
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 22rem;
    }
    .spinner {
      width: 2.25rem;
      height: 2.25rem;
      margin: 0 auto 1.25rem;
      border: 3px solid rgba(61, 156, 240, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .err { color: #f07178; margin-top: 0.75rem; display: none; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="spinner" id="sp"></div>
    <h1>正在选择最优线路</h1>
    <p id="msg">检测网络连通性与延迟…</p>
    <p class="err" id="err"></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
