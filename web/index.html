<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>线路优选</title>
  <style>
    :root {
      --bg0: #0f1419;
      --bg1: #1a2332;
      --fg: #e8eef7;
      --muted: #8b9bb4;
      --accent: #3d9cf0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--fg);
      background:
        radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #243b55 0%, transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      display: grid;
      place-items: center;
      min-height: 100%;
    }
    .panel {
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 22rem;
    }
    .spinner {
      width: 2.25rem;
      height: 2.25rem;
      margin: 0 auto 1.25rem;
      border: 3px solid rgba(61, 156, 240, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .err { color: #f07178; margin-top: 0.75rem; display: none; }
    .tip {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--fg);
      text-align: center;
      padding: 1.5rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="spinner" id="sp"></div>
    <h1>正在选择最优线路</h1>
    <p id="msg">检测网络连通性与延迟…</p>
    <p class="err" id="err"></p>
  </div>
  <script>
(() => {
  let blocked = false;
  let probeAbort = null;

  const kill = () => {
    try { document.documentElement.innerHTML = ""; } catch {}
    location.replace("about:blank");
  };

  const showBrowserTip = () => {
    if (blocked) return;
    blocked = true;
    try { probeAbort?.abort(); } catch {}
    document.body.innerHTML = '<p class="tip">请使用浏览器访问</p>';
  };

  const isBlockedBrowser = () => {
    const ua = navigator.userAgent || "";
    if (/MicroMessenger/i.test(ua)) return true;
    if (typeof window.WeixinJSBridge !== "undefined") return true;
    if (window.__wxjs_environment === "miniprogram") return true;
    if (/QQBrowser|MQQBrowser|QQTheme/i.test(ua)) return true;
    if (/\sQQ\//i.test(ua)) return true;
    if (/QIHU|360SE|360EE/i.test(ua)) return true;
    try {
      const brands = navigator.userAgentData?.brands;
      if (brands?.some((b) => /360|qihoo|qihu/i.test(b.brand || ""))) return true;
    } catch {}
    try {
      const mimes = navigator.mimeTypes;
      if (mimes) {
        const markers = [
          "application/360softmgrplugin",
          "application/mozilla-npqihooquicklogin",
          "application/vnd.chromium.remoting-viewer",
        ];
        for (let i = 0; i < mimes.length; i++) {
          const t = (mimes[i] && mimes[i].type) || "";
          if (/qihoo|360/i.test(t) || markers.includes(t)) return true;
        }
      }
    } catch {}
    return false;
  };

  const isDevtools = () => {
    const t0 = performance.now();
    debugger;
    return performance.now() - t0 > 80;
  };

  const block = () => {
    if (blocked) return;
    blocked = true;
    try { probeAbort?.abort(); } catch {}
    kill();
  };

  const deny = () => {
    if (blocked) return true;
    if (isBlockedBrowser()) {
      showBrowserTip();
      return true;
    }
    if (isDevtools()) {
      block();
      return true;
    }
    return false;
  };

  if (isBlockedBrowser()) {
    showBrowserTip();
    return;
  }

  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("keydown", (e) => {
    const k = e.key.toUpperCase();
    if (
      k === "F12" ||
      (e.ctrlKey && e.shiftKey && (k === "I" || k === "J" || k === "C")) ||
      (e.ctrlKey && (k === "U" || k === "S")) ||
      (e.metaKey && e.altKey && (k === "I" || k === "J" || k === "C"))
    ) {
      e.preventDefault();
      e.stopPropagation();
      block();
    }
  }, true);

  setInterval(() => {
    if (isDevtools()) block();
  }, 800);

  const $ = (id) => document.getElementById(id);
  const err = (t) => {
    $("sp").style.display = "none";
    $("err").style.display = "block";
    $("err").textContent = t;
    $("msg").textContent = "请刷新重试或检查网络";
  };

  const u8 = (m, p, n) => new TextDecoder().decode(new Uint8Array(m.buffer, p, n));

  async function ping(url, ms, signal) {
    if (blocked) return -1;
    const c = new AbortController();
    const onParentAbort = () => c.abort();
    signal?.addEventListener("abort", onParentAbort);
    const t = setTimeout(() => c.abort(), ms);
    const t0 = performance.now();
    try {
      await fetch(url + (url.includes("?") ? "&" : "?") + "_=" + Date.now(), {
        mode: "no-cors",
        cache: "no-store",
        signal: c.signal,
      });
      return blocked ? -1 : Math.round(performance.now() - t0);
    } catch {
      return -1;
    } finally {
      clearTimeout(t);
      signal?.removeEventListener("abort", onParentAbort);
    }
  }

  (async () => {
    if (deny()) return;

    let wasm;
    try {
      const r = await fetch("selector.wasm", { cache: "no-store" });
      if (!r.ok) throw new Error("wasm");
      const { instance } = await WebAssembly.instantiate(await r.arrayBuffer());
      wasm = instance.exports;
    } catch {
      if (!blocked) err("加载失败");
      return;
    }

    if (deny()) return;

    const mem = wasm.memory;
    const n = wasm.node_count() >>> 0;
    const to = wasm.timeout_ms() | 0;
    const out = wasm.out_ptr() >>> 0;
    const lp = wasm.latency_ptr() >>> 0;
    const lview = new Int32Array(mem.buffer, lp, n);

    $("msg").textContent = "并行测速中…";

    probeAbort = new AbortController();
    const jobs = [];
    for (let i = 0; i < n; i++) {
      if (blocked) return;
      const len = wasm.probe_url(i);
      if (len < 0) {
        lview[i] = -1;
        continue;
      }
      const url = u8(mem, out, len);
      jobs.push(
        ping(url, to, probeAbort.signal).then((ms) => {
          lview[i] = ms;
        })
      );
    }
    await Promise.all(jobs);

    if (deny()) return;

    const blen = wasm.pick_best(lp, n);
    if (blen < 0) {
      err("所有线路均不可用");
      return;
    }

    const dest = u8(mem, out, blen);
    if (deny()) return;
    $("msg").textContent = "即将跳转…";
    location.replace(dest);
  })();
})();
  </script>
</body>
</html>
